name: 🚀 Bump version and publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write          # required for OIDC token exchange with npm

    steps:
      - name: Verify branch is main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "This workflow must only be run on the main branch" && exit 1
          fi        
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}   # PAT so lerna can push through branch protection

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci   #instead of npm install to ensure a clean install of dependencies and avoid changing package-lock.json, which will block lerna from publishing packages due to uncommitted changes

      - name: Configure git for lerna
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Compile all packages
        run: lerna run compile

      - name: Bump version
        run: lerna version ${{ github.event.inputs.bump }} --no-private --yes
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Publish to npm
        run: lerna publish from-package --no-private --yes
        env:
          NPM_CONFIG_PROVENANCE: true